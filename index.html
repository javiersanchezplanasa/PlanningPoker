<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning Poker</title>
  <style>
    :root {
      --primary: #3F9C35;
      --primary-light: #5CB85F;
      --primary-dark: #2B6F25;
      --bg: #fafafa;
      --surface: #ffffff;
      --surface2: #f5f5f5;
      --text: #1a1a1a;
      --text-secondary: #666666;
      --border: #e0e0e0;
      --success: #3F9C35;
      --error: #d32f2f;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Landing ── */
    #landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background: linear-gradient(135deg, #fafafa 0%, #f0f7f0 100%);
    }

    .logo { font-size: 4rem; margin-bottom: 0.5rem; }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .subtitle { color: var(--text-secondary); margin-bottom: 2.5rem; font-size: 1rem; }

    .panel {
      background: var(--surface);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 2px 8px rgba(63, 156, 53, 0.08);
    }

    .panel h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--primary); }

    label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    input {
      width: 100%;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
      margin-bottom: 1.25rem;
    }
    input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(63, 156, 53, 0.1);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.9rem 1.5rem;
      transition: all 0.2s;
      user-select: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      width: 100%;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
    }
    .btn-primary:active { transform: scale(0.98); }

    .btn-ghost {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      width: 100%;
    }
    .btn-ghost:hover {
      background: rgba(63, 156, 53, 0.05);
    }

    .divider {
      display: flex; align-items: center; gap: 1rem;
      margin: 1.5rem 0; color: var(--text-secondary); font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Session ── */
    #session {
      display: none;
      flex-direction: row;
      flex: 1;
      background: var(--bg);
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-bottom: 2px solid var(--primary);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .header-brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 1.1rem; color: var(--primary); }

    .share-badge {
      display: flex; align-items: center; gap: 0.5rem;
      background: rgba(63, 156, 53, 0.08);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      color: var(--primary);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .share-badge:hover {
      background: rgba(63, 156, 53, 0.15);
    }
    .share-badge code {
      color: var(--primary-dark);
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .header-name { font-size: 0.9rem; color: var(--text-secondary); }
    .header-name strong { color: var(--primary); }

    /* ── Sidebar historial ── */
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 2px solid var(--primary);
      overflow-y: auto;
      padding: 5.5rem 1rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }

    .history-item {
      background: var(--surface2);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 0.85rem;
      font-size: 0.78rem;
    }

    .history-round {
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 0.4rem;
      font-size: 0.8rem;
    }

    .history-votes {
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
      line-height: 1.4;
      font-size: 0.75rem;
    }

    .history-avg {
      background: rgba(63, 156, 53, 0.1);
      border-left: 3px solid var(--primary);
      padding-left: 0.6rem;
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 0.8rem;
    }

    .sidebar-empty {
      color: var(--text-secondary);
      text-align: center;
      padding: 2rem 0;
      font-size: 0.8rem;
    }

    .main {
      flex: 1;
      padding: 5.5rem 1.5rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      margin-top: 0;
    }

    /* ── Poker Table ── */
    .table {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      perspective: 1200px;
    }

    .table-ellipse {
      position: relative;
      width: 90%;
      max-width: 700px;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #f0f7f0 0%, #e8f4e8 100%);
      border: 3px solid var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(63, 156, 53, 0.15);
    }

    .table-inner {
      width: 95%;
      height: 95%;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seats {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seat {
      position: absolute;
      width: 120px;
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    /* Positioned seats around table */
    .seat:nth-child(1) { top: -50px; }
    .seat:nth-child(2) { right: -30px; top: 15%; }
    .seat:nth-child(3) { right: -30px; bottom: 15%; }
    .seat:nth-child(4) { bottom: -50px; }
    .seat:nth-child(5) { left: -30px; bottom: 15%; }
    .seat:nth-child(6) { left: -30px; top: 15%; }

    @media (min-width: 900px) {
      .seat:nth-child(7) { top: 20%; right: 10%; }
      .seat:nth-child(8) { bottom: 20%; right: 10%; }
      .seat:nth-child(9) { bottom: 20%; left: 10%; }
      .seat:nth-child(10) { top: 20%; left: 10%; }
    }

    .card-flipper {
      width: 80px;
      height: 110px;
      perspective: 1000px;
      position: relative;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.8rem;
      border: 2px solid var(--primary);
    }

    .card-back {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(63, 156, 53, 0.25);
    }

    .card-front {
      background: #fff;
      color: var(--primary);
      transform: rotateY(180deg);
    }

    .card-front.voted { border-color: var(--success); }

    .p-name {
      font-size: 0.8rem;
      color: var(--text-secondary);
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font-weight: 600;
    }
    .p-name.me { color: var(--primary); font-weight: 700; }

    /* ── Results ── */
    .results {
      background: rgba(42, 31, 71, 0.4);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .results-title {
      font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: .15em; color: var(--primary); margin-bottom: 0.75rem; font-weight: 700;
    }
    .stats { display: flex; justify-content: center; gap: 2.5rem; }
    .stat-val { font-size: 2.2rem; font-weight: 800; color: var(--primary); display: block; }
    .stat-lbl { font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.2rem; }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 0.7rem 1.8rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.25s;
      border: none;
      cursor: pointer;
    }

    .btn-reveal {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      box-shadow: 0 4px 15px rgba(124, 106, 255, 0.3);
    }
    .btn-reveal:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(124, 106, 255, 0.5);
    }
    .btn-reveal:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-new {
      background: rgba(212, 175, 55, 0.2);
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-new:hover {
      background: rgba(212, 175, 55, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }

    /* ── Pick cards ── */
    .pick-section {
      margin-top: auto;
      padding-top: 1.5rem;
      border-top: 2px solid rgba(212, 175, 55, 0.2);
      transition: opacity 0.3s;
    }

    .pick-label {
      text-align: center;
      font-size: 0.9rem;
      color: var(--primary);
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .pick-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
    }

    .pick-tile {
      width: 50px;
      height: 70px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      border: 2px solid rgba(212, 175, 55, 0.3);
      background: rgba(42, 31, 71, 0.5);
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-secondary);
      user-select: none;
    }

    .pick-tile:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-3px);
      background: rgba(42, 31, 71, 0.8);
    }

    .pick-tile.selected {
      border-color: var(--primary);
      background: rgba(124, 106, 255, 0.25);
      color: var(--primary-light);
      transform: translateY(-5px);
      box-shadow: 0 4px 15px rgba(124, 106, 255, 0.2);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(26, 26, 36, 0.95);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: transform 0.3s;
      z-index: 999;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 1024px) {
      .sidebar { width: 240px; }
      .main { padding: 5.5rem 1rem 1rem 1rem; }
    }

    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      .panel { padding: 1.8rem; }
      .sidebar { display: none; }
      .main { padding: 5.5rem 1rem 1rem 1rem; }
      .table { gap: 1.5rem; }
      .table-ellipse { max-width: 95%; }
      .seat { width: 100px; height: 120px; }
      .card-flipper { width: 65px; height: 90px; }
      .card-face { font-size: 1.4rem; }
      .stats { gap: 1.5rem; }
      .stat-val { font-size: 1.8rem; }
      .pick-tile { width: 45px; height: 63px; font-size: 1rem; }
    }

    @media (max-width: 500px) {
      header { padding: 0.8rem 1rem; }
      .logo { font-size: 2.5rem; }
      h1 { font-size: 1.6rem; }
      .panel { padding: 1.5rem; max-width: 100%; }
      .table-ellipse { max-width: 98%; }
      .seat:nth-child(n+7) { display: none; }
      .seat { width: 85px; height: 110px; }
      .card-flipper { width: 55px; height: 78px; }
      .card-face { font-size: 1.2rem; border-width: 1.5px; }
      .pick-tile { width: 40px; height: 56px; font-size: 0.95rem; }
      .results { padding: 1rem; }
      .stats { gap: 1rem; }
      .stat-val { font-size: 1.6rem; }
      .controls { gap: 0.5rem; }
      .btn-action { padding: 0.6rem 1.2rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<!-- ── LANDING ── -->
<div id="landing">
  <div class="logo">🃏</div>
  <h1>Planning Poker</h1>
  <p class="subtitle">Estima en equipo, sin anclar los votos</p>

  <div class="panel">
    <h2>Planning Poker</h2>

    <div id="landingView">
      <label for="roomNameInput">Nombre de la sala</label>
      <input id="roomNameInput" type="text" placeholder="Ej: Sprint Planning" maxlength="32" />
      <button class="btn-primary" onclick="createNewSession()">✦ Crear sala</button>
      <p style="font-size: 0.8rem; color: var(--text-secondary); text-align: center; margin-top: 1rem;">
        O accede a través del enlace que compartieron contigo
      </p>
    </div>

    <div id="linkView" style="display:none">
      <div style="background: var(--surface2); border: 2px solid var(--primary); border-radius: 8px; padding: 1.2rem; margin-bottom: 1.5rem;">
        <div style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.8rem;">Comparte este enlace</div>
        <div style="display: flex; gap: 0.5rem;">
          <input id="shareLink" type="text" readonly style="flex: 1; font-size: 0.85rem; padding: 0.6rem;" />
          <button onclick="copyShareLink()" style="background: var(--primary); color: #fff; padding: 0.6rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">📋</button>
        </div>
      </div>
      <button class="btn-primary" onclick="enterSession()">Entrar a la sala</button>
      <button class="btn-ghost" style="margin-top: 0.75rem;" onclick="backToLanding()">← Atrás</button>
    </div>
  </div>
</div>

<!-- ── SESSION ── -->
<div id="session">
  <header>
    <div class="header-brand">🃏 Planning Poker</div>
    <div class="share-badge" onclick="copyLink()" title="Copiar enlace de invitación">
      🔗 Sala&nbsp;<code id="roomCode"></code>&nbsp;· copiar enlace
    </div>
    <div class="header-name">Hola, <strong id="myNameDisplay"></strong></div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-title">📊 Historial</div>
    <div id="historyContainer">
      <div class="sidebar-empty">Sin rondas votadas</div>
    </div>
  </aside>

  <div class="main">
    <div class="table">
      <div class="table-ellipse">
        <div class="table-inner">
          <div class="seats" id="participantsSeats"></div>
        </div>
      </div>

      <div id="resultsBox" class="results" style="display:none">
        <div class="results-title">📊 Resultados de la ronda</div>
        <div class="stats">
          <div><span class="stat-val" id="resAvg">—</span><span class="stat-lbl">Media</span></div>
          <div><span class="stat-val" id="resMin">—</span><span class="stat-lbl">Mínimo</span></div>
          <div><span class="stat-val" id="resMax">—</span><span class="stat-lbl">Máximo</span></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-action btn-reveal" id="revealBtn" onclick="revealVotes()" disabled>👁 Revelar votos</button>
        <button class="btn-action btn-new" onclick="newRound()">↺ Nueva ronda</button>
      </div>
    </div>

    <div class="pick-section" id="pickSection">
      <p class="pick-label">Elige tu carta</p>
      <div class="pick-row" id="pickRow"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ── SCRIPT ── -->
<script type="module">
  import { initializeApp }  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getDatabase, ref, set, update, onValue, remove, onDisconnect }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  /* ── Firebase config ── */
  const app = initializeApp({
    apiKey: "AIzaSyBRPoW4Z6jnOWmYMRDGnQJwJHQVNB48Yr4",
    authDomain: "planningpoker-74969.firebaseapp.com",
    databaseURL: "https://planningpoker-74969-default-rtdb.firebaseio.com",
    projectId: "planningpoker-74969",
    storageBucket: "planningpoker-74969.firebasestorage.app",
    messagingSenderId: "807989209331",
    appId: "1:807989209331:web:140bc5e18904d9c9fe6f86"
  });
  const db = getDatabase(app);

  /* ── Constants ── */
  const CARDS = ['1','2','3','5','8','13','21','40','?','☕'];

  /* ── State ── */
  let sessionId    = null;
  let userId       = null;
  let myName       = null;
  let myVote       = null;
  let history      = [];
  let sessionTimer = null;

  /* ── Expose to HTML onclick ── */
  window.createSession = createSession;
  window.joinSession   = joinSession;
  window.revealVotes   = revealVotes;
  window.newRound      = newRound;
  window.copyLink      = copyLink;

  /* ── Pre-fill code from URL ── */
  const urlCode = new URLSearchParams(location.search).get('s');
  if (urlCode) document.getElementById('codeInput').value = urlCode.toUpperCase();

  /* ── Helpers ── */
  function uid(len = 6) { return Math.random().toString(36).slice(2, 2 + len).toUpperCase(); }

  function localUserId() {
    let id = localStorage.getItem('pp_uid');
    if (!id) { id = uid(14); localStorage.setItem('pp_uid', id); }
    return id;
  }

  function showToast(msg, ms = 3000) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), ms);
  }

  /* ── Entry points ── */
  let pendingRoomName = null;
  let pendingSessionId = null;

  function generateSessionId() {
    return uid(8);
  }

  function createNewSession() {
    const roomName = document.getElementById('roomNameInput').value.trim();
    if (!roomName) { showToast('Escribe el nombre de la sala'); return; }

    pendingRoomName = roomName;
    pendingSessionId = generateSessionId();

    const link = new URL(location.href);
    link.searchParams.set('room', pendingSessionId);
    document.getElementById('shareLink').value = link.toString();

    document.getElementById('landingView').style.display = 'none';
    document.getElementById('linkView').style.display = 'block';
  }

  function copyShareLink() {
    const link = document.getElementById('shareLink');
    link.select();
    navigator.clipboard.writeText(link.value).then(() => {
      showToast('¡Enlace copiado!');
    }).catch(() => {
      showToast(link.value, 5000);
    });
  }

  function enterSession() {
    if (!pendingSessionId || !pendingRoomName) return;
    const name = prompt('¿Cuál es tu nombre?');
    if (name && name.trim()) {
      enter(pendingSessionId, name.trim(), pendingRoomName);
    } else if (name !== null) {
      showToast('Nombre requerido');
    }
  }

  function backToLanding() {
    pendingRoomName = null;
    pendingSessionId = null;
    document.getElementById('landingView').style.display = 'block';
    document.getElementById('linkView').style.display = 'none';
  }

  /* ── Auto-join from URL ── */
  const urlSessionId = new URLSearchParams(location.search).get('room');
  if (urlSessionId && !sessionId) {
    // Esperar a que DOM esté listo
    setTimeout(() => {
      const name = prompt('¿Cuál es tu nombre para entrar a la sala?');
      if (name && name.trim()) {
        enter(urlSessionId, name.trim(), 'Sala compartida');
      }
    }, 100);
  }

  async function enter(sid, name, roomName) {
    sessionId = sid;
    myName    = name;
    userId    = localUserId();

    /* Create or update session metadata */
    const sessionRef = ref(db, `sessions/${sessionId}`);
    const snap = await new Promise(res => onValue(sessionRef, res, { onlyOnce: true }));
    if (!snap.val()) {
      /* New session */
      await set(sessionRef, {
        roomName: roomName,
        createdAt: Date.now(),
        lastActive: Date.now(),
        revealed: false,
        participants: {},
        history: {}
      });
    }

    /* Register presence */
    const meRef = ref(db, `sessions/${sessionId}/participants/${userId}`);
    await set(meRef, { name, vote: null });

    /* When I disconnect, remove myself. If no one's left, clean up session. */
    onDisconnect(meRef).remove();
    onDisconnect(ref(db, `sessions/${sessionId}`)).set({ deletedAt: Date.now() });

    /* Update URL for sharing */
    const u = new URL(location.href);
    u.searchParams.set('s', sessionId);
    history.replaceState({}, '', u);

    /* Show session UI */
    document.getElementById('roomCode').textContent  = sessionId;
    document.getElementById('myNameDisplay').textContent = name;
    document.getElementById('landing').style.display = 'none';
    document.getElementById('session').style.display = 'flex';

    buildPickRow();
    subscribe();
    setupCleanup();
  }

  /* ── Auto-cleanup inactive sessions ── */
  function setupCleanup() {
    if (sessionTimer) clearInterval(sessionTimer);
    sessionTimer = setInterval(() => {
      if (sessionId) {
        update(ref(db, `sessions/${sessionId}`), { lastActive: Date.now() }).catch(() => {});
      }
    }, 30000); /* Every 30 seconds */
  }

  /* ── Pick-card row ── */
  function buildPickRow() {
    const row = document.getElementById('pickRow');
    row.innerHTML = '';
    CARDS.forEach(v => {
      const t = document.createElement('div');
      t.className = 'pick-tile';
      t.textContent = v;
      t.dataset.v = v;
      t.onclick = () => castVote(v);
      row.appendChild(t);
    });
  }

  /* ── Firebase listener ── */
  function subscribe() {
    onValue(ref(db, `sessions/${sessionId}`), snap => {
      const data = snap.val();
      if (data && !data.deletedAt) {
        render(data);
      } else if (data?.deletedAt) {
        /* Session was deleted */
        showToast('La sesión ha sido cerrada', 4000);
        setTimeout(() => location.reload(), 1500);
      }
    });
  }

  /* ── Render ── */
  function render(data) {
    const participants = data.participants || {};
    const revealed     = !!data.revealed;
    const seats        = document.getElementById('participantsSeats');
    seats.innerHTML    = '';

    const numericVotes = [];
    let votedCount = 0;
    const entries = Object.entries(participants);

    entries.forEach(([uid, p]) => {
      const hasVote = p.vote != null;
      if (hasVote) votedCount++;

      /* Build seat */
      const seat = document.createElement('div');
      seat.className = 'seat';

      const flipper = document.createElement('div');
      flipper.className = 'card-flipper';

      const inner = document.createElement('div');
      inner.className = 'card-inner' + (revealed && hasVote ? ' flipped' : '');

      /* Back of card (blue, hidden by default) */
      const back = document.createElement('div');
      back.className = 'card-face card-back';
      back.innerHTML = '🃏';

      /* Front of card (value, shown when flipped) */
      const front = document.createElement('div');
      front.className = 'card-face card-front' + (hasVote ? ' voted' : '');
      if (revealed && hasVote) {
        front.textContent = p.vote;
        const n = parseFloat(p.vote);
        if (!isNaN(n)) numericVotes.push(n);
      } else if (hasVote) {
        front.innerHTML = '✓';
      }

      inner.appendChild(back);
      inner.appendChild(front);
      flipper.appendChild(inner);

      const nameEl = document.createElement('div');
      nameEl.className = 'p-name' + (uid === userId ? ' me' : '');
      nameEl.textContent = (uid === userId ? '★ ' : '') + p.name;

      seat.appendChild(flipper);
      seat.appendChild(nameEl);
      seats.appendChild(seat);
    });

    /* Reveal button */
    const revealBtn = document.getElementById('revealBtn');
    revealBtn.disabled = revealed || votedCount === 0;

    /* Results */
    const resultsBox = document.getElementById('resultsBox');
    if (revealed && numericVotes.length > 0) {
      const avg = (numericVotes.reduce((a, b) => a + b, 0) / numericVotes.length).toFixed(1);
      const min = Math.min(...numericVotes);
      const max = Math.max(...numericVotes);
      document.getElementById('resAvg').textContent = avg;
      document.getElementById('resMin').textContent = min;
      document.getElementById('resMax').textContent = max;
      resultsBox.style.display = 'block';
    } else {
      resultsBox.style.display = 'none';
    }

    /* Sync my pick card highlight */
    myVote = participants[userId]?.vote ?? null;
    document.querySelectorAll('.pick-tile').forEach(t => {
      t.classList.toggle('selected', t.dataset.v === myVote);
    });

    /* Dim pick row when revealed */
    const pickSection = document.getElementById('pickSection');
    pickSection.style.opacity       = revealed ? '0.4' : '1';
    pickSection.style.pointerEvents = revealed ? 'none'  : 'auto';

    /* Render history */
    renderHistory();

    /* Update last activity for cleanup */
    if (sessionId) {
      update(ref(db, `sessions/${sessionId}`), { lastActive: Date.now() }).catch(() => {});
    }
  }

  /* ── Render History ── */
  function renderHistory() {
    const container = document.getElementById('historyContainer');
    if (history.length === 0) {
      container.innerHTML = '<div class="sidebar-empty">Sin rondas votadas</div>';
      return;
    }

    container.innerHTML = '';
    [...history].reverse().forEach((round, idx) => {
      const item = document.createElement('div');
      item.className = 'history-item';

      const roundNum = document.createElement('div');
      roundNum.className = 'history-round';
      roundNum.textContent = `Ronda ${history.length - idx}`;

      const votes = document.createElement('div');
      votes.className = 'history-votes';
      const voteList = Object.values(round.votes).join(', ') || '—';
      votes.textContent = voteList;

      const avg = document.createElement('div');
      avg.className = 'history-avg';
      avg.textContent = `⌀ ${round.avg || '—'}`;

      item.appendChild(roundNum);
      item.appendChild(votes);
      item.appendChild(avg);
      container.appendChild(item);
    });
  }

  /* ── Actions ── */
  async function castVote(v) {
    if (!sessionId) return;
    await update(ref(db, `sessions/${sessionId}/participants/${userId}`), { vote: v });
  }

  async function revealVotes() {
    if (!sessionId) return;
    await update(ref(db, `sessions/${sessionId}`), { revealed: true });
  }

  async function newRound() {
    if (!sessionId) return;

    /* Read current participants */
    const snap = await new Promise(res =>
      onValue(ref(db, `sessions/${sessionId}/participants`), res, { onlyOnce: true })
    );
    const parts = snap.val() || {};

    /* Calculate avg before resetting */
    const votes = {};
    const numericVotes = [];
    Object.entries(parts).forEach(([uid, p]) => {
      if (p.vote) {
        votes[uid] = p.vote;
        const n = parseFloat(p.vote);
        if (!isNaN(n)) numericVotes.push(n);
      }
    });

    const avg = numericVotes.length > 0
      ? (numericVotes.reduce((a, b) => a + b, 0) / numericVotes.length).toFixed(1)
      : null;

    /* Save to history */
    history.push({ votes, avg, timestamp: Date.now() });

    /* Reset for next round */
    const updates = { [`sessions/${sessionId}/revealed`]: false };
    Object.keys(parts).forEach(uid => {
      updates[`sessions/${sessionId}/participants/${uid}/vote`] = null;
    });
    await update(ref(db), updates);
    renderHistory();
  }

  async function copyLink() {
    const u = new URL(location.href);
    u.searchParams.set('s', sessionId);
    try {
      await navigator.clipboard.writeText(u.toString());
      showToast('¡Enlace copiado! Compártelo con tu equipo 🚀');
    } catch {
      showToast(u.toString(), 6000);
    }
  }
</script>
</body>
